# Боевой запуск игры целиком: сборка обоих образов и их связка.
#
#   docker compose up --build -d      поднять
#   docker compose logs -f            смотреть, что происходит
#   docker compose down               остановить
#
# Настройки — в `.env` рядом с этим файлом, образец в `.env.example`.
# Ключа `version` здесь нет намеренно: современный compose его игнорирует
# и ругается на него предупреждением.

name: td-game

services:
  # ── Игровой сервер ───────────────────────────────────────────────
  # Наружу не публикуется. Единственный, кто с ним разговаривает, —
  # nginx во внутренней сети compose. Открытый порт 3001 на хосте дал бы
  # второй адрес игры, мимо прокси, со своими правилами CORS и без TLS.
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: td-game-server:latest
    restart: unless-stopped

    # tini первым процессом. Без него node становится PID 1, а для PID 1
    # сигналы не имеют действия по умолчанию: `docker compose down` ждал бы
    # десять секунд и убивал сервер посреди матча.
    init: true

    environment:
      # Внутри контейнера слушать надо все адреса: 127.0.0.1 виден
      # только самому контейнеру, и nginx до него не достучится.
      HOST: 0.0.0.0
      PORT: '3001'
      NODE_ENV: production

      # Запись матчей по умолчанию выключена, и это не экономия места:
      # compose не знает, чей сервер с него поднимут. Писать ли партии,
      # решает владелец службы — значением MATCHLOG в своём `.env`
      # (см. комментарий в apps/server/src/config.ts).
      MATCHLOG: ${MATCHLOG:-0}
      MATCHLOG_DIR: /data/matchlog

      # Показания игроков, наоборот, по умолчанию сохраняются, и разница
      # с записью матчей намеренная. Запись хранит ход чужой партии —
      # включать её решает владелец. Показания обезличены (матч и сторона,
      # без прозвищ, комнат и билетов), ограничены сверху числом строк
      # на матч и нужны ровно тому, кто службу и держит: без них вопрос
      # «что было в той партии, где дёргалось» остаётся без ответа.
      TELEMETRY: ${TELEMETRY:-1}
      TELEMETRY_DIR: /data/telemetry

      # Общий секрет, которым служба дежурных заверяет свои личности.
      # Пустой означает закрытую регистрацию: игра с компьютером просто
      # недоступна. Умолчание именно пустое — секрет вида `changeme`
      # однажды доехал бы до боевой машины, и никто не заметил бы,
      # пока не стало поздно.
      COMPUTER_SECRET: ${COMPUTER_SECRET:-}

    volumes:
      # Том, а не каталог хоста: записи должны пережить пересборку образа,
      # но не обязаны лежать в рабочем дереве.
      - matchlog:/data/matchlog
      # Показания — свой том, а не подкаталог записей. Запись матча
      # проверяемая правда сервера, показания — заявление недоверенной
      # стороны; разбор не должен гадать, что из этого читает.
      - telemetry:/data/telemetry

    # Проверка живости объявлена в Dockerfile, здесь только сроки.
    healthcheck:
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

    networks:
      - td

  # ── Компьютерные дежурные ────────────────────────────────────────
  # Тот же образ, другая команда запуска. Отдельный процесс нужен затем,
  # чтобы заминка раздумий не задерживала рассылку кадров: прежде служба
  # исполнялась в потоке сервера, и любая её заминка доставалась ВСЕМ
  # идущим матчам, включая матчи двух людей.
  #
  # Наружу не публикуется ничего: служба ходит к серверу сама, как всякий
  # участник, и слушать ей нечего кроме собственных показаний.
  computer:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: td-game-server:latest
    restart: unless-stopped
    init: true

    # Единственное отличие от сервера. Образ собран один раз, второй
    # `build` выше — попадание в кэш, а не вторая сборка.
    command: ['node', 'apps/computer/dist/main.js']

    depends_on:
      server:
        # `service_started`, а не `service_healthy`: служба сама ждёт
        # сервера с нарастающей паузой и падать при неготовом
        # не должна. Ждать здоровья значило бы задваивать ожидание.
        condition: service_started

    environment:
      NODE_ENV: production

      # Тот же секрет, что у сервера: им они и сверяются друг с другом.
      # Пуст — служба не поднимет ни одного дежурного и скажет почему.
      COMPUTER_SECRET: ${COMPUTER_SECRET:-}

      # Имя `server` разрешает внутренняя сеть compose. Порт тот же,
      # что слушает сервер внутри своего контейнера.
      COMPUTER_API_URL: http://server:3001
      COMPUTER_WS_URL: ws://server:3001/game

      # Показания службы. Внутри сети видны, наружу не публикуются:
      # точка доступна тому, кто дотянулся до порта, а числа эти нужны
      # только тому, кто уже внутри.
      COMPUTER_METRICS_PORT: '3002'
      COMPUTER_METRICS_HOST: 0.0.0.0

    # Живость проверяется своими же показаниями: `/health` в этом
    # процессе нет, а отвечающий прибор означает ровно то, что нужно, —
    # процесс жив и его цикл событий не встал колом.
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:3002/metrics']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

    networks:
      - td

  # ── Клиент и прокси ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        # Адреса вшиваются в бандл на сборке. Пусто и /game означают
        # «туда же, откуда пришла страница»: путь относительный, и тот же
        # образ работает и на localhost, и на боевом домене, и под TLS.
        # Менять их нужно, только если сервер вынесен на другой адрес,
        # и тогда после правки обязательна пересборка: `--build`.
        VITE_API_URL: ${VITE_API_URL-}
        VITE_WS_URL: ${VITE_WS_URL:-/game}
    image: td-game-web:latest
    restart: unless-stopped
    init: true

    depends_on:
      server:
        # Именно service_healthy, а не service_started: nginx запоминает
        # адрес сервера при старте и, не найдя его, не поднимается вовсе.
        condition: service_healthy

    environment:
      # Домен подставляется в пути к сертификату внутри шаблона nginx.
      # Двоеточие с вопросом — это не украшение: без домена контейнер
      # обязан упасть сразу и с внятной жалобой, а не подняться
      # с пустым путём и отдавать невнятную ошибку TLS.
      TD_DOMAIN: ${TD_DOMAIN:?задайте TD_DOMAIN в .env}
      # Фильтр обязателен. Без него envsubst подставит и переменные
      # самого nginx — $host, $uri, $http_upgrade, — превратив их
      # в пустые строки, и конфигурация развалится молча.
      NGINX_ENVSUBST_FILTER: '^TD_'

    ports:
      - '${WEB_PORT:-80}:80'
      - '${TLS_PORT:-443}:443'

    volumes:
      # Сертификаты — только на чтение: выписывает и продлевает их
      # certbot, дело nginx — показывать.
      - letsencrypt:/etc/letsencrypt:ro
      # Общий каталог для проверки владения доменом: certbot кладёт
      # сюда файл-ответ, nginx его отдаёт. Благодаря этому продление
      # проходит без остановки игры.
      - certbot-www:/var/www/certbot

    healthcheck:
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - td

  # ── Сертификаты ──────────────────────────────────────────────────
  # Служба живёт вечно и раз в двенадцать часов спрашивает Let's Encrypt,
  # не пора ли продлить. Сам certbot продлевает не раньше чем за месяц
  # до истечения, так что почти все запуски заканчиваются словом «рано» —
  # и это правильно: расписание должно быть чаще срока, а не равно ему.
  #
  # ПЕРВЫЙ сертификат эта служба не выпускает: до его появления nginx
  # не стартует, а без nginx некому отдать файл-ответ. Круг разрывается
  # отдельным сценарием docker/tls-init.sh — он нужен ровно один раз.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    init: true

    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

    # trap на TERM обязателен: без него `docker compose down` ждал бы
    # десять секунд, пока оболочку не убьют силой.
    entrypoint: /bin/sh
    command:
      - -c
      - 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

    networks:
      - td

networks:
  td:
    driver: bridge

volumes:
  matchlog:
  telemetry:
  letsencrypt:
  certbot-www:
