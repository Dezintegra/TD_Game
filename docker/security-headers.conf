# Заголовки безопасности, общие для всех ответов.
#
# Вынесены в отдельный файл не ради красоты, а из-за правила nginx:
# `add_header` НЕ наследуется в блок, где есть свой `add_header`.
# Написав в location единственный заголовок про кэш, вы молча теряете
# все заголовки, объявленные уровнем выше. Поэтому — include в каждом
# таком блоке.
#
# Файл лежит в /etc/nginx/snippets, а не в conf.d: содержимое conf.d
# nginx подключает целиком и сам, и эти директивы применились бы дважды.

add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Обещание браузеру: сюда ходить только по HTTPS, голый HTTP не пробовать.
# Оно закрывает щель между вводом адреса и редиректом — ту секунду, когда
# запрос ещё летит открытым текстом и его можно подменить.
#
# Срок намеренно короткий — сутки. Обещание нельзя отозвать: браузер помнит
# его ровно столько, сколько сказано, и если сертификат перестанет
# обновляться, игроки увидят красный экран без кнопки «всё равно войти».
# Год ставят, когда автопродление доказало, что работает, — а не в день,
# когда его настроили.
add_header Strict-Transport-Security "max-age=86400" always;
