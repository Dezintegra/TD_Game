# Точечная развёртка темпа: одна-две величины, длинная серия.
#
# Отличается от полного перебора назначением, а не устройством. Перебор
# отвечает «что вообще влияет» и платит за широту короткими сериями
# по пять матчей. Развёртка приходит следующей, когда вопрос уже сужен,
# и платит за точность.
#
# Сколько матчей нужно — не вкус, а следствие разброса. Длина матча здесь
# распределена двугорбо: часть партий кончается на третьей минуте прорывом,
# часть досиживает до двадцатиминутного потолка. От десятой до девяностой
# доли выходит 2:30–20:00 при медиане около тринадцати. Медиана двадцати
# наблюдений из такого распределения пляшет на минуты — первая развёртка
# по прочности базы дала немонотонный ряд, где ×0,6 оказалась медленнее
# ×0,7. Это не свойство рычага, это шум больше эффекта.
#
# Отсюда сотня матчей на уровень и раздача уровней по отдельным задачам:
# ждать полчаса одной задачей незачем, когда есть пять параллельных.
name: Развёртка темпа

on:
  workflow_dispatch:
    inputs:
      factors:
        description: 'Величины и уровни, JSON. Например {"baseHp":[0.7,0.8,1]}'
        type: string
        default: '{"baseHp":[0.6,0.7,0.8,0.9,1]}'
      matches:
        description: 'Матчей на ячейку'
        type: string
        default: '100'
      seed:
        description: 'Зерно первого матча'
        type: string
        default: '9000'
  # Пуш нужен ровно до слияния: кнопку GitHub показывает только у того,
  # что уже лежит в ветке по умолчанию. После слияния триггер можно убрать.
  push:
    branches: ['worktree-tempo-window']
    paths:
      - '.github/workflows/tempo-sweep.yml'

concurrency:
  group: tempo-sweep
  cancel-in-progress: true

env:
  FACTORS: ${{ inputs.factors || '{"baseHp":[0.6,0.7,0.8,0.9,1]}' }}
  MATCHES: ${{ inputs.matches || '100' }}
  SEED: ${{ inputs.seed || '9000' }}

jobs:
  sweep:
    name: доля ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      # Одна упавшая доля не уносит остальные: неполная развёртка полезнее
      # пустой, а какого уровня не хватает — видно по таблице.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Прогнать свою долю
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node --no-warnings scripts/experiment/tempo-factorial.mjs \
            --shard "$SHARD" --of 5 --matches "$MATCHES" --seed "$SEED" --jobs 3 \
            --factors "$FACTORS" --out "sweep-$SHARD.json"

      - uses: actions/upload-artifact@v4
        with:
          name: tempo-sweep-shard-${{ matrix.shard }}
          path: sweep-${{ matrix.shard }}.json
          retention-days: 30

  summary:
    name: сводка
    runs-on: ubuntu-latest
    needs: sweep
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: tempo-sweep-shard-*
          path: shards
          merge-multiple: true

      - name: Свести
        run: |
          node --no-warnings scripts/experiment/summarize.mjs shards \
            --out tempo-sweep.json --summary tempo-sweep.md
          cat tempo-sweep.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tempo-sweep
          path: |
            tempo-sweep.json
            tempo-sweep.md
          retention-days: 90
