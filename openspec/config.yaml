schema: spec-driven

context: |
  Продукт: браузерная игра в жанре Tower Defense с PvP-режимом (игрок против игрока)
  в реальном времени. Веб-платформа, никакой установки клиента.

  Ключевое нефункциональное требование: максимальная отзывчивость интерфейса.
  Любое действие игрока должно давать визуальный отклик в том же кадре (< 16 мс),
  сетевая задержка маскируется client-side prediction, а не спиннерами.

  Репозиторий: монорепозиторий, TypeScript везде (strict), ESM.
  Менеджер пакетов: pnpm workspaces. Оркестрация задач: Turborepo.

  Структура:
    apps/client   — Vite + React 19 (только HUD/меню) + PixiJS v8 (игровое поле, WebGL/WebGPU)
    apps/server   — Node.js, Fastify (REST/матчмейкинг) + uWebSockets.js/ws (реалтайм)
    packages/sim  — детерминированное ядро симуляции, изоморфное (клиент и сервер),
                    фиксированный тик, целочисленная математика, seeded PRNG, без Date/Math.random
    packages/protocol — бинарный сетевой протокол (кодек поверх ArrayBuffer), общие типы сообщений
    packages/shared   — общие типы, игровые константы, балансные конфиги
    packages/ui       — переиспользуемые React-компоненты и дизайн-токены

  Сетевая модель: авторитетный сервер принимает только команды игроков (inputs),
  симуляция детерминированная, клиент предсказывает и делает rollback при расхождении.
  Синхронизируются входы, а не состояние мира.

  Конвенции:
    - Conventional Commits
    - Тесты: Vitest (unit), Playwright (e2e). Детерминизм sim покрывается golden-тестами.
    - Линт: ESLint 9 flat config + Prettier
    - Внутренние пакеты называются @td/<name>
    - Никакой бизнес-логики в React-компонентах: игровой цикл живёт вне React

rules:
  proposal:
    - Всегда включать раздел "Non-goals"
    - Явно указывать влияние на отзывчивость интерфейса и на сетевой трафик
  design:
    - Для любой фичи, затрагивающей геймплей, описывать поведение при рассинхроне и реконнекте
  tasks:
    - Дробить задачи на куски не длиннее 2 часов
    - Каждая задача должна быть проверяемой (тест, команда или наблюдаемый результат)
